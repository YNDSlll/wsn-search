.search-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(83,74,183,0.15); background: white; }
.search-hint { text-align: right; font-size: 11px; color: var(--text-muted); margin-top: 6px; }

/* Filters */
.filters { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.filter-btn { padding: 7px 14px; border: 1.5px solid var(--primary-light); background: white; color: var(--primary); border-radius: 20px; cursor: pointer; font-size: 13px; font-weight: 500; transition: all 0.25s; user-select: none; }
.filter-btn:hover { background: var(--primary-bg); }
.filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

.q-card { background: white; border-radius: 14px; margin-bottom: 16px; box-shadow: var(--card-shadow); overflow: hidden; transition: transform 0.2s, box-shadow 0.2s; }

.card-head { display: flex; justify-content: space-between; align-items: center; padding: 14px 20px 10px; gap: 10px; flex-wrap: wrap; }

.type-short { background: var(--primary-bg); color: var(--primary); }
.type-calc { background: var(--success-bg); color: var(--success); }
.type-design { background: var(--warning-bg); color: var(--warning); }

.card-body { padding: 0 20px 16px; }

.question-text { font-size: 15px; color: var(--text); line-height: 1.75; margin-bottom: 12px; word-break: break-word; }

.answer-block { background: var(--success-bg); border-left: 4px solid var(--success); border-radius: 8px; padding: 14px 18px; margin-bottom: 12px; }
.answer-label { font-weight: 700; color: var(--success); font-size: 13px; margin-bottom: 6px; }
.answer-content { font-size: 14px; color: var(--text); line-height: 1.85; white-space: pre-wrap; word-break: break-word; }

.detail-toggle .arrow { transition: transform 0.25s; font-family: monospace; }
.detail-toggle.open .arrow { transform: rotate(90deg); }

.detail-content { max-height: 0; overflow: hidden; transition: max-height 0.35s ease; }
.detail-content.show { max-height: 100000px; }
.detail-inner { padding: 14px 18px; background: #fafbff; border-radius: 10px; margin-top: 10px; border: 1px solid #eeeef5; font-size: 14px; line-height: 1.9; color: var(--text-light); white-space: pre-wrap; word-break: break-word; }

}

.detail-inner::-webkit-scrollbar { width: 6px; }

</style>

    "answer": "标准答案 无线传感器网络是大量的静止或移动的传感器以自组织和多跳的方式构成的无线网络，目的是协作地探测、处理和传输网络覆盖区域内感知对象的监测信息，并报告给用户。英文是Wireless Sensor Network，简称WSN。\n\n    零基础逐词解析：\n\n    大量：WSN通常部署很多传感器节点（几十到几千个），不是单个传感器。\n\n    静止或移动：节点可以是固定的（部署在农田里监测温度），也可以是移动的（装在车上巡逻监控）。大多数WSN节点是静止的。\n\n    自组织（Self-organized）：节点部署后自动形成网络，不需要人工配置。就像一群人到了一个地方，自动开始互相认识、建立联系。\n\n    多跳（Multi-hop）：数据不是直接从源节点到达目的地，而是经过多个中间节点\"跳转\"传递。就像传话游戏：A告诉B，B告诉C，C告诉D，最终消息到达D。每个中间节点就是一\"跳\"。\n\n    协作地：多个传感器节点不是各自为战，而是一起合作完成任务。比如多个节点一起监测同一区域的温度，互相验证数据。\n\n    探测、处理和传输：三个功能——感知（探测环境）、计算（处理数据）、通信（传输信息）。这是传感器节点的三大核心功能。\n\n    网络覆盖区域：WSN覆盖的物理区域范围。所有部署的节点共同覆盖一个区域。\n\n    感知对象：被监测的对象，比如温度、湿度、光照、振动等。\n\n    报告给用户：最终目的是把监测信息传递给用户（通过汇聚节点/Sink节点）。\n\n  考试要点：定义中必须包含的关键词：大量、自组织、多跳、协作、探测/处理/传输。少一个扣分。",

    "answer": "标准答案 综合平均法是把来自多个传感器的众多数据进行综合平均。它适用于同类传感器检测同一个检测目标。这是最简单、最直观的数据融合方法。该方法将一组传感器提供的冗余信息进行加权平均，结果作为融合值。公式：融合结果 = Σ(wi × xi) / Σwi，其中wi为分配给第i次检测的权重。\n\n    零基础概念铺垫：\n\n    什么是数据融合？在WSN中，多个传感器可能测量同一个目标（比如5个温度传感器都测同一区域的温度），它们的数据可能略有不同。数据融合就是把这些数据合并处理，得到一个更准确的结果。\n\n    什么是综合平均法？\n\n    最简单的数据融合方法——把多个传感器的测量值取平均。\n\n    举例：5个温度传感器测得的温度分别是：25.1°C, 25.3°C, 24.9°C, 25.0°C, 25.2°C\n\n    - 简单平均（每个传感器权重相同）：(25.1+25.3+24.9+25.0+25.2)/5 = 25.1°C\n\n    - 加权平均（有些传感器更可靠，权重更大）：比如传感器3精度高，权重更大\n\n    加权平均公式：\n\n    融合结果 = Σ(wi × xi)\n\n    其中wi是第i个传感器（或第i次检测）的权重，xi是第i个测量值\n\n    适用条件：同类传感器（都是温度传感器）、检测同一目标（同一区域的温度）\n\n    通俗类比 5个人估测一个物体的重量，各说不同的值，取平均得到最靠谱的估计。如果某个人更专业，就给他更大的权重。\n\n  考试要点：①同类传感器 ②同一目标 ③加权平均 ④最简单的融合方法。记住公式。",

    "answer": "标准答案 洪泛路由协议（Flooding Protocol）是一种最早的路由协议，接收到消息的节点以广播的形式转发报文给所有的邻居节点。源节点S希望发送数据给目的节点D，节点S首先通过网络将数据分组传送给它的每一个邻居节点，每一个邻居节点又将其传输给各自的邻居节点（除了刚刚给它们发送数据分组的节点S外）。如此继续，直到将数据传输到目标节点D为止，或者为该数据所设定的生命期限变为零为止，或者所有节点拥有此数据分组为止。优点：实现简单，适用于健壮性要求高的场合。缺点：存在信息爆炸问题、数据交迭现象和盲目使用资源。\n\n    零基础概念铺垫：\n\n    什么是路由协议？路由协议决定数据从源节点如何\"走\"到目标节点。就像快递选择走哪条路送到目的地。\n\n    什么是洪泛（Flooding）？\n\n    洪泛是最简单粗暴的路由方式——收到消息就转发给所有人，像洪水一样扩散。\n\n    工作流程：\n\n    1. 源节点S要发数据给目标节点D\n\n    2. S把数据发给所有邻居节点（广播）\n\n    3. 每个邻居收到后，再发给自己的所有邻居（但不回发给刚发给它的S，避免循环）\n\n    4. 如此层层扩散，直到：\n\n       - 数据到达了目标节点D ✅ \n\n       - 或者数据的\"生命期限\"（TTL）到期了，数据被丢弃 ⏰ \n\n       - 或者所有节点都收到了这个数据 🔄 \n\n    三个终止条件详解：\n\n    - 到达目标：消息成功送达\n\n    - 生命期限变为零：每个数据包有个TTL计数器，每转发一次减1，到0就不再转发。防止数据无限传播\n\n    - 所有节点都拥有：如果网络中每个节点都已经收到了这个数据，就没必要再转发了\n\n    优点（好处）：\n\n    - 实现简单：不需要复杂的路由算法，收到就转发\n\n    - 健壮性高：即使有些节点坏了，数据还能通过其他路径到达目标（冗余路径多）\n\n    缺点（问题）：\n\n    - 信息爆炸：大量重复数据在网络中传播，造成带宽浪费。就像一个人喊一声，全场每个人都重复喊\n\n    - 数据交迭：同一个区域的不同传感器可能监测到相同事件，洪泛导致重复数据叠加\n\n    - 盲目使用资源：不管数据是否需要，所有节点都转发，浪费能量和带宽\n\n    通俗类比 洪泛 = 在教室里传纸条给某个人，但每个人都把纸条抄一遍传给所有同桌。纸条最终会到目标人手里，但整个教室纸条泛滥。\n\n  考试要点：①广播转发给所有邻居 ②三个终止条件 ③优点(简单/健壮) ④三个缺点(信息爆炸/数据交迭/盲目用资源)。这道10分，要答全面。",

    "answer": "标准答案 WSN中有三类硬件平台：传感器节点、汇聚节点（基站/Sink/网关）、管理节点。\n\n    零基础逐节点详解：\n\n    ①传感器节点（Sensor Node）——\"一线员工\"\n\n    兼作传统网络的终端和路由器双重功能：\n\n    - 作为终端：进行本地信息收集和数据处理（感知环境、采集数据）\n\n    - 作为路由器：对其他节点转发的数据进行存储、管理和融合，并转发数据\n\n    - 与其他节点协作完成特定任务\n\n    传感器节点组成模块：\n\n    - 处理器模块：控制和管理整个节点（CPU）\n\n    - 传感器模块：采集环境信息（温度、光照、压力、声音等）并做数据转换\n\n    - 无线通信模块：按通信协议与其他节点通信\n\n    - 存储模块：存储数据和程序\n\n    - 电源模块：为节点供电（通常是电池）\n\n    - 可选模块：定位模块、移动管理模块等\n\n    ②汇聚节点（Sink Node / Gateway / Base Station）——\"中转站\"\n\n    实现两个通信网络之间的数据交换和协议转换：\n\n    - 连接WSN内部网络和外部网络（如Internet）\n\n    - 发布管理节点的监测任务\n\n    - 把WSN收集到的数据转发到外部网络\n\n    - 可以是增强功能的传感器节点，也可以是纯网关设备\n\n    汇聚节点组成模块：\n\n    - 电源系统：电池或市电供电\n\n    - 存储模块：存储系统/数据信息\n\n    - 处理器模块：管理和控制整个系统\n\n    - 节点通信模块：与传感器节点交互\n\n    - 网络通信模块：与外部网络通信\n\n    ③管理节点（Management Node）——\"总部\"\n\n    - 对整个网络进行监测和管理\n\n    - 通常是运行网络管理软件的PC机或手持终端\n\n    - 用户通过管理节点查看数据、发布任务\n\n    通俗类比 传感器节点=前线士兵（采集+传递）；汇聚节点=通讯基站（内网→外网转换）；管理节点=指挥部（查看+指挥）。\n\n  考试要点：三种节点各答功能+组成模块。10分题要答详细：传感器节点(终端+路由器双功能+5模块)、汇聚节点(协议转换+连接内外网+5模块)、管理节点(PC+监测管理)。",

    "answer": "标准答案\n\n    零基础逐层解析：\n\n    什么是CC2530？\n\n    CC2530是TI（德州仪器）推出的一款SoC（System on Chip，系统级芯片），专门用于2.4GHz IEEE 802.15.4和ZigBee应用。它把单片机、无线通信、ADC等全部集成在一个芯片上，非常适合做WSN节点。\n\n    【硬件部分】\n\n    CC2530芯片集成了：\n\n    - 8051兼容微控制器（CPU/处理器）——相当于节点的大脑\n\n    - ZigBee射频(RF)前端——无线通信模块\n\n    - 内存（RAM）和FLASH存储器——存储程序和数据\n\n    - ADC（模数转换器）——将传感器模拟信号转为数字信号\n\n    基于CC2530的智能传感器节点硬件结构：\n\n    利用ZigBee技术和IEEE 1451.2协议构建：\n\n    1. 传感器——感知环境（温度、光照等）\n\n    2. 放大和滤波电路——对传感器输出的模拟信号进行放大和去除噪声\n\n    3. A/D转换（ADC）——把模拟信号转为数字信号\n\n    4. 通信模块（CC2530的RF部分）——无线发送数据\n\n    5. 电源模块——供电\n\n    信号流向： 传感器感知 → 放大滤波 → A/D转换 → CC2530处理 → 无线通信发送\n\n    【软件部分】\n\n    开发环境主要包括：\n\n    1. CC25XX/CC2530无线单片机软件集成开发环境——编写和编译代码的工具（类似Visual Studio）\n\n    2. CC25XX/CC2530芯片FLASH编程软件——把程序烧录到芯片的工具\n\n    3. ZigBee协议分析软件——分析和调试ZigBee通信的工具\n\n    4. 基于PC的管理分析软件——在电脑上监控和管理WSN的工具\n\n    通俗类比 硬件 = 身体（传感器=眼睛，CC2530=大脑+嘴巴）；软件 = 思维方式（开发环境=训练场，编程软件=学习工具）。\n\n  考试要点：硬件：CC2530 SoC集成(8051+RF+RAM+FLASH+ADC) + 传感器节点结构(传感器→放大滤波→A/D→通信)。软件：4种开发工具(IDE+编程+协议分析+管理)。",

    "answer": "标准答案 ZigBee三种逻辑设备：协调器(Coordinator)、路由器(Router)、终端设备(End-Device)\n\n    零基础逐设备详解：\n\n    ①协调器（Coordinator）——\"网络创始人\"\n\n    - 启动整个网络：它是网络的第一个设备，负责创建网络\n\n    - 选择信道：选择一个可用的无线通信频率通道\n\n    - 选择网络ID（PAN ID）：用16位个域网标志符来标识这个网络，相当于给网络取名\n\n    - 启动网络：完成上述选择后，正式启动网络运行\n\n    - 可以协助建立安全层和应用层的绑定（bindings）\n\n    ②路由器（Router）——\"中继站\"\n\n    - 允许其他设备加入网络：新设备可以通过路由器加入ZigBee网络\n\n    - 多跳路由：转发数据，让数据经过多个路由器跳转到目的地\n\n    - 协助终端设备通信：帮助电池供电的子终端设备转发数据\n\n    - 通常一直处于活动状态（不能睡眠），因此需要主电源供电（不能用电池）\n\n    - 但在树型网络模式下，允许路由器间隔周期操作，这时可以用电池\n\n    ③终端设备（End-Device）——\"干活小兵\"\n\n    - 没有维持网络结构的责任：不需要管理网络、不需要转发数据\n\n    - 可以睡眠或唤醒：没有任务时可以进入睡眠省电，需要时唤醒\n\n    - 因此可以电池供电\n\n    - 对存储空间需求很小（特别是RAM）\n\n    - 功能简单：只负责采集数据、发送数据给父节点\n\n      设备类型核心功能供电方式能否睡眠通俗类比\n      协调器创建/启动网络主电源不能公司创始人\n      路由器路由转发/中继主电源通常不能快递中转站\n      终端设备采集数据电池可以一线快递员\n\n    ZigBee网络组成：1个Coordinator + 多个Router + 多个End-Device\n\n    PAN ID 16位的个域网标志符，用来标识一个ZigBee网络，相当于网络的\"名字\"。\n\n  考试要点：三种设备：①协调器(启动网络+选PAN ID) ②路由器(路由转发+不睡眠+主电源) ③终端(采集+可睡眠+电池)。10分题要答详细。",

    "full_explanation": "概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n【概念解释】\n所有无线网络按有没有\"固定基站\"来分两类：\n\n有基础设施的网络：有固定基站（Access Point）作为中心枢纽。比如WiFi——所有设备都连到路由器，路由器负责转发数据。\n\n无基础设施的网络：没有固定基站，节点之间自己组网、自己转发。比如WSN——传感器节点随意撒到野外，它们自己找到邻居、自己组织成网络。\n\n通俗类比\n\n【概念解释】\n无线Ad Hoc网络 = 无基础设施的自组织网络。它又分为两个子类：\n\n移动Ad Hoc网络（MANET）：节点可以移动，重点是节点之间的通信。比如战场上的士兵用无线电互相联络。\n\n无线传感器网络（WSN）：节点一般不移动，重点是感知和采集数据。比如森林里的温度传感器网络。\n\n通俗类比\n\n【概念解释】\n这是两种网络核心关注点的区别：\n\n因特网以地址为中心：你要访问百度，先知道baidu.com这个地址，然后通过IP地址找到服务器。网络关心的是\"你在哪里\"。\n\n传感器网络以数据为中心：你不在乎是哪个传感器上报的30°C，你只关心\"这片区域温度是30°C\"。网络关心的是\"数据是什么\"。\n\n通俗类比\n\n【概念解释】\nWSN按组网方式分三种：\n\n集中式：有一个中心节点（如Sink节点），所有数据都汇聚到它那里。像一个班长收集全班作业。\n\n分布式：没有中心节点，数据在节点间就近处理和转发。像同学们互相交流信息。\n\n混合式：两者结合——部分集中管理，部分分布式处理。\n\n通俗类比\n\n【概念解释】\nWSN按节点功能和结构层次分四种：\n\n平面网络结构：所有节点平等，没有等级区分。像一群平级同事。\n\n分级网络结构：节点分等级——有骨干节点（簇首）和普通节点（成员）。像公司有经理和员工。\n\n混合网络结构：平面+分级混合。\n\nMesh网络结构：节点之间多路径互联，冗余度高，可靠性好。像城市里多条路可到达目的地。\n\n通俗类比\n\n【概念解释】\nOSI七层模型从下到上：物理层→数据链路层→网络层→传输层→会话层→表示层→应用层\n\n中间5层（数据链路~表示层）每一层都和上下两层通信——向上提供服务，向下请求服务。\n\n但物理层在最底层，只有上面一个邻居（数据链路层），没有下面的邻居。\n\n应用层在最顶层，只有下面一个邻居（表示层），没有上面的邻居。\n\n通俗类比\n\n【概念解释】\nIEEE 802.15.4是ZigBee的底层通信标准。它针对的是\"低速无线个域网\"：\n\nLow-Rate = 低速率（数据传输速度慢，但功耗低）\n\nWireless = 无线（不需要线缆）\n\nPersonal Area Network = 个域网（覆盖范围小，通常10米左右，个人使用）\n\n缩写LR-WPAN就是全称的简写。\n\n通俗类比\n\n【概念解释】\nWSN的传输介质就是数据在空气中\"飞行\"的方式，分三种：\n\n无线电波（Radio Wave）：最常用！ZigBee、WiFi都用无线电波。穿透力强，覆盖范围大，不需要对准方向。\n\n红外线（Infrared）：像电视遥控器用的就是红外线。缺点：必须对准方向（直线传播），不能穿墙。\n\n光波（Light Wave）：用可见光或激光传输数据。速度极快但受环境影响大（雾、雨会干扰）。\n\n通俗类比\n\n【概念解释】\n物理时间：就是钟表上的时间——几点几分几秒。对应现实世界的时间。用来判断\"这个事件发生在3点05分\"。\n\n逻辑时间：不关心具体几点几分，只关心事件的先后顺序——\"A事件先发生，B事件后发生\"。用逻辑时钟（Lamport时钟）来记录。\n\n通俗类比\n\n【概念解释】\nWSN中的\"定位\"分两种：\n\n结点自身定位：网络中的传感器节点确定自己在哪里。比如一个温度传感器算出自己坐标是(30.5, 114.3)。\n\n目标定位：传感器节点确定被监测对象在哪里。比如温度传感器感知到前方50米有一辆车经过，确定车的位置。\n\n通俗类比\n\n【定位流程】\n注意顺序：先自身定位（知道自己位置），才能做目标定位（推算目标位置）！\n\n考试要点：自身定位是前提——节点先知道自己位置，才能帮目标定位。顺序很重要！\n\n【概念解释】\n位置信息分两大类：\n\n物理位置：用具体坐标表示。比如GPS坐标(30.5°N, 114.3°E)，或者相对坐标\"距离锚点A 10米\"。是精确的数字。\n\n符号位置：用语义/名称表示。比如\"在3号教室\"、\"在图书馆二楼\"、\"在A区\"。是描述性的文字。\n\n通俗类比\n\n【两者关系】\n物理位置更精确，符号位置更直观。很多系统会同时使用两种。\n\n考试要点：物理位置 = 数字坐标，符号位置 = 文字描述。记住\"数字 vs 文字\"的区分。\n\n【概念解释】\n传感器按是否需要外部能源来工作，分两类：\n\n有源传感器：需要外部电源才能工作。比如摄像头需要供电才能拍摄，超声波传感器需要电源才能发射声波。\n\n无源传感器：不需要外部电源，自己就能产生信号。比如热电偶——温度变化直接产生电压信号，太阳能电池——光照直接产生电流。\n\n通俗类比\n\n【概念解释】\nWSN中的故障检测按检测对象分两类：\n\n部件检测：检测节点内部各个部件是否正常。比如传感器模块坏了？通信模块坏了？电池耗尽了？\n\n节点检测：检测整个节点是否还在正常工作。比如节点是否掉线了？是否还在网络中？\n\n通俗类比\n\n【⚠️ 与2023A卷的区别】\n2023A卷第7题的故障检测答案是\"集中式、分布式\"（按检测方式分类）\n\n2023B卷的答案是\"部件检测、节点检测\"（按检测对象分类）\n\n分类角度不同，答案不同！一定要注意区分！\n\n考试要点：按对象分→部件检测/节点检测；按方式分→集中式/分布式。看清题目问的角度！\n\n【概念解释】\nZigBee支持三种拓扑：\n\n星形(Star)：所有终端设备连到一个中心协调器。简单但中心节点压力大。\n\n网状(Mesh)：节点之间多路径互联。可靠性强，任一路径断了可换另一条。\n\n簇树形(Cluster Tree)：按层级组织，簇首管理簇成员，簇首之间再互联。题目已给。\n\n通俗类比\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！"

    "full_explanation": "概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n【概念解释】\n无线Ad Hoc网络 = 无基础设施的自组织网络。它又分为两个子类：\n\n移动Ad Hoc网络（MANET）：节点可以移动，重点是节点之间的通信。比如战场上的士兵用无线电互相联络。\n\n无线传感器网络（WSN）：节点一般不移动，重点是感知和采集数据。比如森林里的温度传感器网络。\n\n通俗类比\n\n【概念解释】\n这是两种网络核心关注点的区别：\n\n因特网以地址为中心：你要访问百度，先知道baidu.com这个地址，然后通过IP地址找到服务器。网络关心的是\"你在哪里\"。\n\n传感器网络以数据为中心：你不在乎是哪个传感器上报的30°C，你只关心\"这片区域温度是30°C\"。网络关心的是\"数据是什么\"。\n\n通俗类比\n\n【概念解释】\nWSN按组网方式分三种：\n\n集中式：有一个中心节点（如Sink节点），所有数据都汇聚到它那里。像一个班长收集全班作业。\n\n分布式：没有中心节点，数据在节点间就近处理和转发。像同学们互相交流信息。\n\n混合式：两者结合——部分集中管理，部分分布式处理。\n\n通俗类比\n\n【概念解释】\nWSN按节点功能和结构层次分四种：\n\n平面网络结构：所有节点平等，没有等级区分。像一群平级同事。\n\n分级网络结构：节点分等级——有骨干节点（簇首）和普通节点（成员）。像公司有经理和员工。\n\n混合网络结构：平面+分级混合。\n\nMesh网络结构：节点之间多路径互联，冗余度高，可靠性好。像城市里多条路可到达目的地。\n\n通俗类比\n\n【概念解释】\nOSI七层模型从下到上：物理层→数据链路层→网络层→传输层→会话层→表示层→应用层\n\n中间5层（数据链路~表示层）每一层都和上下两层通信——向上提供服务，向下请求服务。\n\n但物理层在最底层，只有上面一个邻居（数据链路层），没有下面的邻居。\n\n应用层在最顶层，只有下面一个邻居（表示层），没有上面的邻居。\n\n通俗类比\n\n【概念解释】\nIEEE 802.15.4是ZigBee的底层通信标准。它针对的是\"低速无线个域网\"：\n\nLow-Rate = 低速率（数据传输速度慢，但功耗低）\n\nWireless = 无线（不需要线缆）\n\nPersonal Area Network = 个域网（覆盖范围小，通常10米左右，个人使用）\n\n缩写LR-WPAN就是全称的简写。\n\n通俗类比\n\n【概念解释】\nWSN的传输介质就是数据在空气中\"飞行\"的方式，分三种：\n\n无线电波（Radio Wave）：最常用！ZigBee、WiFi都用无线电波。穿透力强，覆盖范围大，不需要对准方向。\n\n红外线（Infrared）：像电视遥控器用的就是红外线。缺点：必须对准方向（直线传播），不能穿墙。\n\n光波（Light Wave）：用可见光或激光传输数据。速度极快但受环境影响大（雾、雨会干扰）。\n\n通俗类比\n\n【概念解释】\n物理时间：就是钟表上的时间——几点几分几秒。对应现实世界的时间。用来判断\"这个事件发生在3点05分\"。\n\n逻辑时间：不关心具体几点几分，只关心事件的先后顺序——\"A事件先发生，B事件后发生\"。用逻辑时钟（Lamport时钟）来记录。\n\n通俗类比\n\n【概念解释】\nWSN中的\"定位\"分两种：\n\n结点自身定位：网络中的传感器节点确定自己在哪里。比如一个温度传感器算出自己坐标是(30.5, 114.3)。\n\n目标定位：传感器节点确定被监测对象在哪里。比如温度传感器感知到前方50米有一辆车经过，确定车的位置。\n\n通俗类比\n\n【定位流程】\n注意顺序：先自身定位（知道自己位置），才能做目标定位（推算目标位置）！\n\n考试要点：自身定位是前提——节点先知道自己位置，才能帮目标定位。顺序很重要！\n\n【概念解释】\n位置信息分两大类：\n\n物理位置：用具体坐标表示。比如GPS坐标(30.5°N, 114.3°E)，或者相对坐标\"距离锚点A 10米\"。是精确的数字。\n\n符号位置：用语义/名称表示。比如\"在3号教室\"、\"在图书馆二楼\"、\"在A区\"。是描述性的文字。\n\n通俗类比\n\n【两者关系】\n物理位置更精确，符号位置更直观。很多系统会同时使用两种。\n\n考试要点：物理位置 = 数字坐标，符号位置 = 文字描述。记住\"数字 vs 文字\"的区分。\n\n【概念解释】\n传感器按是否需要外部能源来工作，分两类：\n\n有源传感器：需要外部电源才能工作。比如摄像头需要供电才能拍摄，超声波传感器需要电源才能发射声波。\n\n无源传感器：不需要外部电源，自己就能产生信号。比如热电偶——温度变化直接产生电压信号，太阳能电池——光照直接产生电流。\n\n通俗类比\n\n【概念解释】\nWSN中的故障检测按检测对象分两类：\n\n部件检测：检测节点内部各个部件是否正常。比如传感器模块坏了？通信模块坏了？电池耗尽了？\n\n节点检测：检测整个节点是否还在正常工作。比如节点是否掉线了？是否还在网络中？\n\n通俗类比\n\n【⚠️ 与2023A卷的区别】\n2023A卷第7题的故障检测答案是\"集中式、分布式\"（按检测方式分类）\n\n2023B卷的答案是\"部件检测、节点检测\"（按检测对象分类）\n\n分类角度不同，答案不同！一定要注意区分！\n\n考试要点：按对象分→部件检测/节点检测；按方式分→集中式/分布式。看清题目问的角度！\n\n【概念解释】\nZigBee支持三种拓扑：\n\n星形(Star)：所有终端设备连到一个中心协调器。简单但中心节点压力大。\n\n网状(Mesh)：节点之间多路径互联。可靠性强，任一路径断了可换另一条。\n\n簇树形(Cluster Tree)：按层级组织，簇首管理簇成员，簇首之间再互联。题目已给。\n\n通俗类比\n\n【概念解释】\n蓝牙的两种通信模式：\n\n点对点（Point-to-Point）：两个设备之间直接通信。比如手机连一个蓝牙耳机——一对一。\n\n点对多点（Point-to-Multipoint）：一个主设备同时和多个从设备通信。比如一个手机同时连耳机、手表、音箱——一对多。\n\n通俗类比\n\n【蓝牙网络结构】\n蓝牙的网络叫Piconet（微网）：\n\n- 1个主设备（Master）+ 最多7个活跃从设备（Slave）\n\n- 主设备控制所有通信时序\n\n- 多个Piconet可以互联形成Scatternet（散网）\n\n考试要点：点对点 = 一对一，点对多点 = 一对多。蓝牙是短距离（约10米）、中等速率的无线通信技术。\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！"

    "full_explanation": "概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n【概念解释】\nWSN按组网方式分三种：\n\n集中式：有一个中心节点（如Sink节点），所有数据都汇聚到它那里。像一个班长收集全班作业。\n\n分布式：没有中心节点，数据在节点间就近处理和转发。像同学们互相交流信息。\n\n混合式：两者结合——部分集中管理，部分分布式处理。\n\n通俗类比\n\n【概念解释】\nWSN按节点功能和结构层次分四种：\n\n平面网络结构：所有节点平等，没有等级区分。像一群平级同事。\n\n分级网络结构：节点分等级——有骨干节点（簇首）和普通节点（成员）。像公司有经理和员工。\n\n混合网络结构：平面+分级混合。\n\nMesh网络结构：节点之间多路径互联，冗余度高，可靠性好。像城市里多条路可到达目的地。\n\n通俗类比\n\n【概念解释】\nOSI七层模型从下到上：物理层→数据链路层→网络层→传输层→会话层→表示层→应用层\n\n中间5层（数据链路~表示层）每一层都和上下两层通信——向上提供服务，向下请求服务。\n\n但物理层在最底层，只有上面一个邻居（数据链路层），没有下面的邻居。\n\n应用层在最顶层，只有下面一个邻居（表示层），没有上面的邻居。\n\n通俗类比\n\n【概念解释】\nIEEE 802.15.4是ZigBee的底层通信标准。它针对的是\"低速无线个域网\"：\n\nLow-Rate = 低速率（数据传输速度慢，但功耗低）\n\nWireless = 无线（不需要线缆）\n\nPersonal Area Network = 个域网（覆盖范围小，通常10米左右，个人使用）\n\n缩写LR-WPAN就是全称的简写。\n\n通俗类比\n\n【概念解释】\nWSN的传输介质就是数据在空气中\"飞行\"的方式，分三种：\n\n无线电波（Radio Wave）：最常用！ZigBee、WiFi都用无线电波。穿透力强，覆盖范围大，不需要对准方向。\n\n红外线（Infrared）：像电视遥控器用的就是红外线。缺点：必须对准方向（直线传播），不能穿墙。\n\n光波（Light Wave）：用可见光或激光传输数据。速度极快但受环境影响大（雾、雨会干扰）。\n\n通俗类比\n\n【概念解释】\n物理时间：就是钟表上的时间——几点几分几秒。对应现实世界的时间。用来判断\"这个事件发生在3点05分\"。\n\n逻辑时间：不关心具体几点几分，只关心事件的先后顺序——\"A事件先发生，B事件后发生\"。用逻辑时钟（Lamport时钟）来记录。\n\n通俗类比\n\n【概念解释】\nWSN中的\"定位\"分两种：\n\n结点自身定位：网络中的传感器节点确定自己在哪里。比如一个温度传感器算出自己坐标是(30.5, 114.3)。\n\n目标定位：传感器节点确定被监测对象在哪里。比如温度传感器感知到前方50米有一辆车经过，确定车的位置。\n\n通俗类比\n\n【定位流程】\n注意顺序：先自身定位（知道自己位置），才能做目标定位（推算目标位置）！\n\n考试要点：自身定位是前提——节点先知道自己位置，才能帮目标定位。顺序很重要！\n\n【概念解释】\n位置信息分两大类：\n\n物理位置：用具体坐标表示。比如GPS坐标(30.5°N, 114.3°E)，或者相对坐标\"距离锚点A 10米\"。是精确的数字。\n\n符号位置：用语义/名称表示。比如\"在3号教室\"、\"在图书馆二楼\"、\"在A区\"。是描述性的文字。\n\n通俗类比\n\n【两者关系】\n物理位置更精确，符号位置更直观。很多系统会同时使用两种。\n\n考试要点：物理位置 = 数字坐标，符号位置 = 文字描述。记住\"数字 vs 文字\"的区分。\n\n【概念解释】\n传感器按是否需要外部能源来工作，分两类：\n\n有源传感器：需要外部电源才能工作。比如摄像头需要供电才能拍摄，超声波传感器需要电源才能发射声波。\n\n无源传感器：不需要外部电源，自己就能产生信号。比如热电偶——温度变化直接产生电压信号，太阳能电池——光照直接产生电流。\n\n通俗类比\n\n【概念解释】\nWSN中的故障检测按检测对象分两类：\n\n部件检测：检测节点内部各个部件是否正常。比如传感器模块坏了？通信模块坏了？电池耗尽了？\n\n节点检测：检测整个节点是否还在正常工作。比如节点是否掉线了？是否还在网络中？\n\n通俗类比\n\n【⚠️ 与2023A卷的区别】\n2023A卷第7题的故障检测答案是\"集中式、分布式\"（按检测方式分类）\n\n2023B卷的答案是\"部件检测、节点检测\"（按检测对象分类）\n\n分类角度不同，答案不同！一定要注意区分！\n\n考试要点：按对象分→部件检测/节点检测；按方式分→集中式/分布式。看清题目问的角度！\n\n【概念解释】\nZigBee支持三种拓扑：\n\n星形(Star)：所有终端设备连到一个中心协调器。简单但中心节点压力大。\n\n网状(Mesh)：节点之间多路径互联。可靠性强，任一路径断了可换另一条。\n\n簇树形(Cluster Tree)：按层级组织，簇首管理簇成员，簇首之间再互联。题目已给。\n\n通俗类比\n\n【概念解释】\n蓝牙的两种通信模式：\n\n点对点（Point-to-Point）：两个设备之间直接通信。比如手机连一个蓝牙耳机——一对一。\n\n点对多点（Point-to-Multipoint）：一个主设备同时和多个从设备通信。比如一个手机同时连耳机、手表、音箱——一对多。\n\n通俗类比\n\n【蓝牙网络结构】\n蓝牙的网络叫Piconet（微网）：\n\n- 1个主设备（Master）+ 最多7个活跃从设备（Slave）\n\n- 主设备控制所有通信时序\n\n- 多个Piconet可以互联形成Scatternet（散网）\n\n考试要点：点对点 = 一对一，点对多点 = 一对多。蓝牙是短距离（约10米）、中等速率的无线通信技术。\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！"

直接通信。比如手机连一个蓝牙耳机——一对一。\n\n点对多点（Point-to-Multipoint）：一个主设备同时和多个从设备通信。比如一个手机同时连耳机、手表、音箱——一对多。\n\n通俗类比\n\n【蓝牙网络结构】\n蓝牙的网络叫Piconet（微网）：\n\n- 1个主设备（Master）+ 最多7个活跃从设备（Slave）\n\n- 主设备控制所有通信时序\n\n- 多个Piconet可以互联形成Scatternet（散网）\n\n考试要点：点对点 = 一对一，点对多点 = 一对多。蓝牙是短距离（约10米）、中等速率的无线通信技术。\n\n【定义拆解（6个关键词）】\n这句话很长，但核心只有6个关键词：\n\n• 大量——不是几个节点，是成百上千个\n\n• 自组织——没有中心控制，节点自己找邻居组网\n\n• 多跳——数据不是直传，而是经过多个节点接力传递\n\n• 协作——多个节点一起工作，不是各自为战\n\n• 感知对象的监测信息——采集温度、湿度等环境数据\n\n• 报告给用户——最终目的是把数据送给需要的人\n\n通俗类比\n\n【核心特点（4个要点）】\n• 两层结构：上层=骨干节点（簇首），下层=一般节点（成员）\n\n• 功能不同：骨干节点有MAC+路由+管理+安全功能；一般节点可能没有路由/管理功能\n\n• 簇的组织形式：网络分成多个\"簇\"，每个簇有一个簇首和多个成员\n\n• 骨干节点对等：所有骨干节点之间是平等的，互相通信\n\n通俗类比\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！"

不是直传，而是经过多个节点接力传递\n\n• 协作——多个节点一起工作，不是各自为战\n\n• 感知对象的监测信息——采集温度、湿度等环境数据\n\n• 报告给用户——最终目的是把数据送给需要的人\n\n通俗类比\n\n【核心特点（4个要点）】\n• 两层结构：上层=骨干节点（簇首），下层=一般节点（成员）\n\n• 功能不同：骨干节点有MAC+路由+管理+安全功能；一般节点可能没有路由/管理功能\n\n• 簇的组织形式：网络分成多个\"簇\"，每个簇有一个簇首和多个成员\n\n• 骨干节点对等：所有骨干节点之间是平等的，互相通信\n\n通俗类比\n\n【核心思想（一句话）】\n多个传感器测同一个东西 → 把测量值加权平均 → 得到更准确的融合值。\n\n通俗类比\n\n【适用条件】\n同类传感器 + 同一个检测目标 = 才能用综合平均法\n\n不同类传感器（比如温度+湿度）不能用平均法混合！\n\n答题要点：必须写出公式、适用条件（同类传感器+同一目标）、加权平均的概念。最简单的数据融合方法。\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！"

    "full_explanation": "概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n定义拆解（6个关键词）\n\n核心特点（4个要点）\n\n核心思想（一句话）\n\n三步走流程\n\n核心思想（一句话）\n\n【概念解释】\nWSN中的\"定位\"分两种：\n\n结点自身定位：网络中的传感器节点确定自己在哪里。比如一个温度传感器算出自己坐标是(30.5, 114.3)。\n\n目标定位：传感器节点确定被监测对象在哪里。比如温度传感器感知到前方50米有一辆车经过，确定车的位置。\n\n通俗类比\n\n【定位流程】\n注意顺序：先自身定位（知道自己位置），才能做目标定位（推算目标位置）！\n\n考试要点：自身定位是前提——节点先知道自己位置，才能帮目标定位。顺序很重要！\n\n【概念解释】\n位置信息分两大类：\n\n物理位置：用具体坐标表示。比如GPS坐标(30.5°N, 114.3°E)，或者相对坐标\"距离锚点A 10米\"。是精确的数字。\n\n符号位置：用语义/名称表示。比如\"在3号教室\"、\"在图书馆二楼\"、\"在A区\"。是描述性的文字。\n\n通俗类比\n\n【两者关系】\n物理位置更精确，符号位置更直观。很多系统会同时使用两种。\n\n考试要点：物理位置 = 数字坐标，符号位置 = 文字描述。记住\"数字 vs 文字\"的区分。\n\n【概念解释】\n传感器按是否需要外部能源来工作，分两类：\n\n有源传感器：需要外部电源才能工作。比如摄像头需要供电才能拍摄，超声波传感器需要电源才能发射声波。\n\n无源传感器：不需要外部电源，自己就能产生信号。比如热电偶——温度变化直接产生电压信号，太阳能电池——光照直接产生电流。\n\n通俗类比\n\n【概念解释】\nWSN中的故障检测按检测对象分两类：\n\n部件检测：检测节点内部各个部件是否正常。比如传感器模块坏了？通信模块坏了？电池耗尽了？\n\n节点检测：检测整个节点是否还在正常工作。比如节点是否掉线了？是否还在网络中？\n\n通俗类比\n\n【⚠️ 与2023A卷的区别】\n2023A卷第7题的故障检测答案是\"集中式、分布式\"（按检测方式分类）\n\n2023B卷的答案是\"部件检测、节点检测\"（按检测对象分类）\n\n分类角度不同，答案不同！一定要注意区分！\n\n考试要点：按对象分→部件检测/节点检测；按方式分→集中式/分布式。看清题目问的角度！\n\n【概念解释】\nZigBee支持三种拓扑：\n\n星形(Star)：所有终端设备连到一个中心协调器。简单但中心节点压力大。\n\n网状(Mesh)：节点之间多路径互联。可靠性强，任一路径断了可换另一条。\n\n簇树形(Cluster Tree)：按层级组织，簇首管理簇成员，簇首之间再互联。题目已给。\n\n通俗类比\n\n【概念解释】\n蓝牙的两种通信模式：\n\n点对点（Point-to-Point）：两个设备之间直接通信。比如手机连一个蓝牙耳机——一对一。\n\n点对多点（Point-to-Multipoint）：一个主设备同时和多个从设备通信。比如一个手机同时连耳机、手表、音箱——一对多。\n\n通俗类比\n\n【蓝牙网络结构】\n蓝牙的网络叫Piconet（微网）：\n\n- 1个主设备（Master）+ 最多7个活跃从设备（Slave）\n\n- 主设备控制所有通信时序\n\n- 多个Piconet可以互联形成Scatternet（散网）\n\n考试要点：点对点 = 一对一，点对多点 = 一对多。蓝牙是短距离（约10米）、中等速率的无线通信技术。\n\n【定义拆解（6个关键词）】\n这句话很长，但核心只有6个关键词：\n\n• 大量——不是几个节点，是成百上千个\n\n• 自组织——没有中心控制，节点自己找邻居组网\n\n• 多跳——数据不是直传，而是经过多个节点接力传递\n\n• 协作——多个节点一起工作，不是各自为战\n\n• 感知对象的监测信息——采集温度、湿度等环境数据\n\n• 报告给用户——最终目的是把数据送给需要的人\n\n通俗类比\n\n【核心特点（4个要点）】\n• 两层结构：上层=骨干节点（簇首），下层=一般节点（成员）\n\n• 功能不同：骨干节点有MAC+路由+管理+安全功能；一般节点可能没有路由/管理功能\n\n• 簇的组织形式：网络分成多个\"簇\"，每个簇有一个簇首和多个成员\n\n• 骨干节点对等：所有骨干节点之间是平等的，互相通信\n\n通俗类比\n\n【核心思想（一句话）】\n多个传感器测同一个东西 → 把测量值加权平均 → 得到更准确的融合值。\n\n通俗类比\n\n【适用条件】\n同类传感器 + 同一个检测目标 = 才能用综合平均法\n\n不同类传感器（比如温度+湿度）不能用平均法混合！\n\n答题要点：必须写出公式、适用条件（同类传感器+同一目标）、加权平均的概念。最简单的数据融合方法。\n\n【三步走流程】\n• 建边界框：每个锚点画一个正方形边界框——以锚点坐标为中心，边长=2×测距值di。节点一定在这个框内！\n\n• 取交集：三个锚点的边界框重叠区域 = 交叉矩形。对所有[xi+di]取最小值min，对所有[xi-di]取最大值max → 交集矩形 = [max(xi-di), min(xi+di)] × [max(yi-di), min(yi+di)]\n\n• 取质心：交叉矩形的中心点 = 待定位节点的估计位置\n\n通俗类比\n\n【核心思想（一句话）】\n收到消息 → 广播转发给所有邻居（除了发给你消息的那个节点）→ 直到到达目标或满足终止条件。\n\n三个终止条件\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！"

    "full_explanation": "概念解释\n\n概念解释\n\n概念解释\n\n概念解释\n\n定义拆解（6个关键词）\n\n核心特点（4个要点）\n\n核心思想（一句话）\n\n三步走流程\n\n核心思想（一句话）\n\n【概念解释】\n传感器按是否需要外部能源来工作，分两类：\n\n有源传感器：需要外部电源才能工作。比如摄像头需要供电才能拍摄，超声波传感器需要电源才能发射声波。\n\n无源传感器：不需要外部电源，自己就能产生信号。比如热电偶——温度变化直接产生电压信号，太阳能电池——光照直接产生电流。\n\n通俗类比\n\n【概念解释】\nWSN中的故障检测按检测对象分两类：\n\n部件检测：检测节点内部各个部件是否正常。比如传感器模块坏了？通信模块坏了？电池耗尽了？\n\n节点检测：检测整个节点是否还在正常工作。比如节点是否掉线了？是否还在网络中？\n\n通俗类比\n\n【⚠️ 与2023A卷的区别】\n2023A卷第7题的故障检测答案是\"集中式、分布式\"（按检测方式分类）\n\n2023B卷的答案是\"部件检测、节点检测\"（按检测对象分类）\n\n分类角度不同，答案不同！一定要注意区分！\n\n考试要点：按对象分→部件检测/节点检测；按方式分→集中式/分布式。看清题目问的角度！\n\n【概念解释】\nZigBee支持三种拓扑：\n\n星形(Star)：所有终端设备连到一个中心协调器。简单但中心节点压力大。\n\n网状(Mesh)：节点之间多路径互联。可靠性强，任一路径断了可换另一条。\n\n簇树形(Cluster Tree)：按层级组织，簇首管理簇成员，簇首之间再互联。题目已给。\n\n通俗类比\n\n【概念解释】\n蓝牙的两种通信模式：\n\n点对点（Point-to-Point）：两个设备之间直接通信。比如手机连一个蓝牙耳机——一对一。\n\n点对多点（Point-to-Multipoint）：一个主设备同时和多个从设备通信。比如一个手机同时连耳机、手表、音箱——一对多。\n\n通俗类比\n\n【蓝牙网络结构】\n蓝牙的网络叫Piconet（微网）：\n\n- 1个主设备（Master）+ 最多7个活跃从设备（Slave）\n\n- 主设备控制所有通信时序\n\n- 多个Piconet可以互联形成Scatternet（散网）\n\n考试要点：点对点 = 一对一，点对多点 = 一对多。蓝牙是短距离（约10米）、中等速率的无线通信技术。\n\n【定义拆解（6个关键词）】\n这句话很长，但核心只有6个关键词：\n\n• 大量——不是几个节点，是成百上千个\n\n• 自组织——没有中心控制，节点自己找邻居组网\n\n• 多跳——数据不是直传，而是经过多个节点接力传递\n\n• 协作——多个节点一起工作，不是各自为战\n\n• 感知对象的监测信息——采集温度、湿度等环境数据\n\n• 报告给用户——最终目的是把数据送给需要的人\n\n通俗类比\n\n【核心特点（4个要点）】\n• 两层结构：上层=骨干节点（簇首），下层=一般节点（成员）\n\n• 功能不同：骨干节点有MAC+路由+管理+安全功能；一般节点可能没有路由/管理功能\n\n• 簇的组织形式：网络分成多个\"簇\"，每个簇有一个簇首和多个成员\n\n• 骨干节点对等：所有骨干节点之间是平等的，互相通信\n\n通俗类比\n\n【核心思想（一句话）】\n多个传感器测同一个东西 → 把测量值加权平均 → 得到更准确的融合值。\n\n通俗类比\n\n【适用条件】\n同类传感器 + 同一个检测目标 = 才能用综合平均法\n\n不同类传感器（比如温度+湿度）不能用平均法混合！\n\n答题要点：必须写出公式、适用条件（同类传感器+同一目标）、加权平均的概念。最简单的数据融合方法。\n\n【三步走流程】\n• 建边界框：每个锚点画一个正方形边界框——以锚点坐标为中心，边长=2×测距值di。节点一定在这个框内！\n\n• 取交集：三个锚点的边界框重叠区域 = 交叉矩形。对所有[xi+di]取最小值min，对所有[xi-di]取最大值max → 交集矩形 = [max(xi-di), min(xi+di)] × [max(yi-di), min(yi+di)]\n\n• 取质心：交叉矩形的中心点 = 待定位节点的估计位置\n\n通俗类比\n\n【核心思想（一句话）】\n收到消息 → 广播转发给所有邻居（除了发给你消息的那个节点）→ 直到到达目标或满足终止条件。\n\n三个终止条件\n\n【通俗类比】\n👉 洪泛 = 班级传纸条——一个人写好纸条，传给周围所有人，每个人再传给周围所有人……\n\n👉 终止条件1 = 纸条终于传到目标同学手上\n\n👉 终止条件2 = 纸条上写了\"最多传10次\"，传了10次就停\n\n👉 终止条件3 = 全班人都看过纸条了，不用再传了\n\n三个缺点（必须记住！）\n\n【优点】\n实现简单，适用于健壮性要求高的场合（就算网络很差也能传到）。\n\n答题要点：基本思想+三个终止条件+三个缺点+一个优点。10分大题要写得完整！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！\n\n这道题在2023A卷和2024B卷都没有出现，是2023B卷独有的考点！"

    "full_explanation": "核心公式\n\n核心思想（一句话）\n\nMesh网络结构图\n\n艺术馆问题（Art Gallery Problem）\n\n两个概念的定义\n\nZigBee协议栈5层结构\n\n三类数据融合\n\nZigBee 9大技术特点\n\n【核心公式】\nE = k · dn\n\nE=能耗，k=系数，d=通信距离，n=路径损耗指数(2&lt;n&lt;4)\n\n【公式拆解】\nE（Energy）：发送数据消耗的能量\n\nk：系数，取决于天线效率、发射功率等硬件因素\n\nd（Distance）：通信距离，两个节点之间多远\n\nn：路径损耗指数，取值范围2~4，取决于环境\n\nn的取值与环境因素\n\n【通俗类比】\n👉 n=2 = 在空旷的沙漠里喊话——声音传播较远\n\n👉 n=3 = 在普通环境喊话——有一些障碍物遮挡\n\n👉 n=4 = 在密集的森林里喊话——障碍物太多，声音很快衰减\n\n👉 关键结论：与其一步跨10米（能耗=10³=1000），不如分5步各2米（能耗=5×2³=40），省电25倍！\n\n答题要点：①写出公式E=k·d^n ②说明n取值范围2~4 ③说明n与环境的关系 ④通常取n=3 ⑤得出结论：多跳通信优于单跳，通信半径100m以内合适。\n\n【核心思想（一句话）】\n把多个传感器提供的证据合并在一起，逐步缩小不确定的范围，最终做出更可靠的判断。\n\n关键概念\n\n【通俗类比】\n3个传感器判断\"前方是否有敌人\"：\n\n👉 传感器A说：80%相信有敌人（证据1）\n\n👉 传感器B说：60%相信有敌人（证据2）\n\n👉 传感器C说：说不准，30%不确定（证据3）\n\n→ D-S方法把这3条证据合并，计算出综合信任度，比单独任何一个传感器都可靠。\n\n与贝叶斯方法的区别\n\n【Mesh网络结构图】\nMesh网络 = 网状网络，节点之间多路径互联。每个节点至少和一个其他节点通信，形成网状拓扑。\n\n6大技术特点\n\n【艺术馆问题（Art Gallery Problem）】\n核心问题：用最少的相机，让馆内每个点至少被一台相机监视到。\n\n解题步骤\n\n【通俗类比】\n👉 艺术馆 = 一个不规则形状的房间\n\n👉 三角测量 = 把房间划分成若干三角区域\n\n👉 每个三角形放一个相机 = 从三角形的某个顶点可以看到三角形内所有点\n\n👉 最少相机 = 尽量让一个相机覆盖多个三角形\n\n重要结论\n\n【两个概念的定义】\n物理时间：人类社会使用的绝对时间——几点几分几秒。对应现实世界的时间刻度。\n\n逻辑时间：体现事件发生的顺序关系——谁先发生谁后发生。是一个相对概念，不关心具体时间。\n\n意义和作用（两个方面）\n\n【ZigBee协议栈5层结构】\n从上到下：\n\n①应用层（最上层）→ 定义各种类型的应用业务\n\n做什么用：智能家居控制、温度监测等具体应用\n\n【通俗类比】\n👉 应用层 = 你用手机APP操控智能家居（用户看到的界面）\n\n👉 应用汇聚层 = APP把你的指令翻译成网络能理解的格式\n\n👉 网络层 = 邮局决定走哪条路线送信\n\n👉 数据链路层 = 邮局内部的分拣和排队规则\n\n👉 物理层 = 实际的快递车在路上跑（无线电波）\n\n答题要点：5层从上到下依次写出，每层说明主要功能。必须写：应用层→应用汇聚层→网络层→数据链路层→物理层。注意\"应用汇聚层\"是ZigBee特有的，别漏！\n\n【三类数据融合】\n①数据级融合（最底层）\n\n操作对象：传感器采集的原始数据\n\n根本思想：面向数据的融合——尽可能保留原始信息，提供其他层次融合不具有的细微信息\n\n特点：仅依赖传感器类型，不依赖用户需求\n\n例子：像素级融合——对图像像素进行分类组合，去除冗余信息\n\n【通俗类比（判断前方是否有敌人）】\n👉 数据级 = 把3个雷达的原始信号数据全部合并分析（最详细）\n\n👉 特征级 = 从每个雷达信号中提取\"距离\"\"速度\"等特征，再合并（中等详细）\n\n👉 决策级 = 每个雷达先自己判断\"有没有敌人\"，然后投票决定最终结论（最简洁）\n\n层级关系\n\n【ZigBee 9大技术特点】\n①\n\n这道题在其他三卷都没有以简答题形式出现！是本卷独有考点。但ZigBee技术特点在2023A简述题中考了。"

    "answer": "评分标准：画出传感器结构图4分 + 关键性能指标6分\n\n解题思路\n两部分：画网络拓扑图（4分）+ 写关键性能指标（6分）\n\n第一部分：画网络拓扑图（4分）\n选择5种以上传感器 + 选择一种拓扑结构（星型/网状/簇树型）+ 画出结构图\n\n示例：簇树型拓扑\n传感器选择：温度、温湿度、光照、人体感应、震动、可燃气体（6种）\n\n结构：协调器（中心）→ 簇首1（温度+温湿度+光照）+ 簇首2（人体感应+震动+可燃气体）\n\n簇首之间可互相通信，簇首与协调器通信，成员节点与簇首通信\n\n第二部分：关键性能指标（6分）\n\n①网络工作寿命\n\n首要因素是能源供给。每个节点必须管理自身能源以使网络寿命最大化。节点的最小工作寿命会限制系统正常工作。\n\n②网络覆盖范围\n\n不只是单个节点的通信距离。多跳通信可大大扩展覆盖范围，理论上可无限扩展。但范围越大→信息经过节点越多→延迟和可靠性问题。\n\n③网络搭建成本和难易程度\n\nWSN突出优点是搭建容易。但长期成本包括维护费用。需要自维护功能+维护请求机制。软硬件测试+鲁棒性保障。\n\n④网络响应时间\n\n每个网络有特定响应时间。安全监测应用必须立即发送警报。但快速响应和网络寿命相互制约——频繁唤醒=高功耗=短寿命。",

    "full_explanation": "解题思路\n\n填空题独有率对比\n\n【解题思路】\n两部分：画网络拓扑图（4分）+ 写关键性能指标（6分）\n\n第一部分：画网络拓扑图（4分）\n\n【第二部分：关键性能指标（6分）】\n①网络工作寿命\n\n首要因素是能源供给。每个节点必须管理自身能源以使网络寿命最大化。节点的最小工作寿命会限制系统正常工作。\n\n【通俗类比】\n👉 工作寿命 = 手机的续航时间——越长越好\n\n👉 覆盖范围 = WiFi能覆盖多大区域\n\n👉 成本 = 买手机多少钱 + 修手机多少钱\n\n👉 响应时间 = 安全警报要在多少秒内发出\n\n答题要点：①选5种以上传感器 ②选一种拓扑结构并画图 ③写4个关键性能指标（寿命/覆盖/成本/响应时间）④说明指标之间的关系（如响应时间vs寿命的制约关系）。\n\n【填空题独有率对比】\n试卷总空数独有空数独有率特点\n2024B30约620%重叠最多\n2023A30约1860%中等独有\n2023B30约1033%与2024B高度重叠\n2024A30约2273%独有率最高！\n\n四卷重叠考点清单（至少2卷出现的）\n\n【2024A卷独有考点清单】\n填空题独有（其他三卷没考过的）：\n\n1. WSN功能与信息技术对应（采集→感官，处理→大脑，传输→神经）\n\n2. MANET特征（无线通信方式/动态组网/动态路由）\n\n3. 物理接口四特性（机械/电气/功能/规程）\n\n4. 三种时间同步协议名称（RBS/Ting/Mini-Sync/TPSN）\n\n5. 判断策略（多数投票/均值/中值）\n\n6. 路由协议按获取方法分（主动/按需/混合）\n\n简答题独有：\n\n7. D-S证据推理法\n\n8. ZigBee协议框架（5层结构）\n\n设计题独有：\n\n9. 关键性能指标（寿命/覆盖/成本/响应时间）\n\n【⭐ 全四卷必背最高频考点】\n五星级（至少3卷出现）：\n\n1. WSN标准定义（大量+传感器+自组织+多跳+协作+报告用户）\n\n2. ZigBee三种拓扑（星形/网状/簇树形）\n\n3. 有/无基础设施网络\n\n四星级（至少2卷出现）：\n\n4. 集中式/分布式/混合式组网\n\n5. 平面/分级/混合/Mesh结构层次\n\n6. 物理时间/逻辑时间\n\n7. 数据融合三级分类（数据级/特征级/决策级）\n\n8. ZigBee技术特点（9点）\n\n9. 综合平均法\n\n10. 分级网络结构\n\n11. Min-max定位方法\n\n12. 洪泛路由协议\n\n13. 能耗与距离关系\n\n14. 艺术馆问题\n\n15. 硬件节点设计要求\n\n三星级（1卷出现但可能再考）：\n\n16. 无损失/有损失融合\n\n17. 直接/平面/层次路由\n\n18. ZigBee协议框架\n\n19. D-S证据推理法\n\n20. 卡尔曼滤波法\n\n21. 三种时间同步协议\n\n22. 判断策略（投票/均值/中值）\n\n23. 传输介质（无线电波/红外线/光波）\n\n24. 自身定位/目标定位\n\n25. 有源/无源传感器\n\n26. 蓝牙通信模式\n\n27. 物理接口四特性\n\n28. 关键性能指标（寿命/覆盖/成本/响应）"

    "answer": "参考答案：RSSI（Received Signal Strength Indication）测距：利用接收信号强度与传播距离的关系估计距离。信号传播越远，衰减越大，接收功率越低。通过已知的信号衰减模型（如对数距离路径损耗模型），由接收功率反推距离。ToA（Time of Arrival）测距：测量信号从发送端到接收端的传播时间，乘以电磁波传播速度（光速）得到距离。要求收发双方时间精确同步，精度高于 RSSI。\n\n        零基础讲解\n        RSSI：根据“声音越大越近，声音越小越远”来判断。手机信号格数多就是离基站近，格数少就是远。公式形式：P_r = P_t - 10n·log(d) + C。\n\n        ToA：根据“回声测距”判断。发送一个信号，记录发送和接收时间，时间差 × 光速 = 距离。非常精确，但需要时间同步。\n\n      记忆技巧：RSSI = 看信号强弱（简单但受干扰大）；ToA = 看传播时间（精确但需同步）。",

// ========== 初始化 ==========
const resultsDiv = document.getElementById('results');
const searchInput = document.getElementById('searchInput');
let currentTypeFilter = 'all';

// 统计题型分布
const typeStats = {};
questionsDB.forEach(q => {
  const t = q.type || '其他';
  typeStats[t] = (typeStats[t] || 0) + 1;
});

// 渲染筛选按钮
function renderFilters() {
  const bar = document.getElementById('filterBar');
  const types = ['all', ...Object.keys(typeStats).sort()];
  const labels = { 'all': '全部', '填空题': '填空', '简答题': '简答', '计算题': '计算', '设计题': '设计', '简述题': '简述', '选择题': '选择', '判断题': '判断', '实验题': '实验', '论述题': '论述', '其他': '其他' };
  
  bar.innerHTML = types.map(t => {
    const label = labels[t] || t.replace('题','');
    const cnt = t === 'all' ? questionsDB.length : (typeStats[t] || 0);
    return `<button class="filter-btn ${t==='all'?'active':''}" onclick="setFilter('${t}',this)">${label}<span class="count">(${cnt})</span></button>`;
  }).join('');
}
renderFilters();

document.getElementById('totalCount').textContent = questionsDB.length;

// ========== 核心搜索逻辑 ==========
function doSearch() {
  const keyword = searchInput.value.trim().toLowerCase();
  displayResults(keyword, currentTypeFilter);
}

function setFilter(type, btn) {
  currentTypeFilter = type;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  doSearch();
}

// 搜索匹配：在题目、答案、讲解、关键词四个维度中查找
function matchQuestion(q, kw) {
  if (!kw) return true;
  const fields = [
    q.question || '',
    q.answer || '',
    q.full_explanation || ''
  ].join(' ').toLowerCase();

  // 关键词精确匹配
  if ((q.keywords || []).some(k => k.toLowerCase().includes(kw))) return true;

  // 全文模糊匹配（支持部分匹配）
  if (fields.includes(kw)) return true;
  
  // 中文分词匹配（逐字检查）
  if ([...kw].every(ch => fields.includes(ch)) && kw.length >= 2) return true;

  // 英文子串匹配
  if (fields.includes(kw) || fields.includes(kw.toUpperCase())) return true;
  
  return false;
}

function highlightText(text, kw) {
  if (!kw || !text) return text;
  const safeKw = kw.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  try {
    const re = new RegExp(`(${safeKw})`, 'gi');
    return text.replace(re, '<span class="highlight">$1</span>');
  } catch(e) { return text; }
}

// ========== 显示结果 ==========
function displayResults(keyword, typeFilter) {
  // 过滤
  let filtered = questionsDB.filter(q => {
    if (typeFilter !== 'all' && q.type !== typeFilter) return false;
    return matchQuestion(q, keyword);
  });

  // 排序：优先匹配题目的排前面
  if (keyword) {
    filtered.sort((a,b) => {
      const aq = (a.question||'').toLowerCase().includes(keyword) ? 1 : 0;
      const bq = (b.question||'').toLowerCase().includes(keyword) ? 1 : 0;
      return bq - aq;
    });
  }

  document.getElementById('matchCount').textContent = filtered.length;

  if (filtered.length === 0) {
    resultsDiv.innerHTML = `
      <div class="no-results">
        <div class="no-results-icon">🔍</div>
        <p style="font-size:16px;margin:8px 0;">没有找到匹配的题目</p>
        <p style="font-size:13px;color:#aaa;">试试：ZigBee · 洪泛路由 · OSI · 能耗 · 定位 · 时间同步 · CC2530 · 融合</p>
      </div>`;
    return;
  }

  // 渲染卡片
  resultsDiv.innerHTML = filtered.map((q, idx) => {
    const tc = getTypeClass(q.type);
    
    // 高亮处理
    let qText = q.question || '';
    let aText = (q.answer || '').replace(/^标准答案[：:\s]*/,'').trim();
    let eText = q.full_explanation || '';
    
    if (keyword) {
      qText = highlightText(qText, keyword);
      aText = highlightText(aText, keyword);
      eText = highlightText(eText, keyword);
    }

    const hasDetail = eText && eText.trim().length > 5;
    
    return `<div class="q-card" data-id="${q.id}">
      <div class="card-head">
        <span class="type-badge ${tc}">${escapeHtml(q.type || '其他')} ${escapeHtml(q.number || '')}</span>
        <span class="source-tag">📄 ${escapeHtml(q.source || '')}</span>
      </div>
      <div class="card-body">
        <div class="question-text">${qText}</div>
        
        <div class="answer-block">
          <div class="answer-label">✅ 标准答案</div>
          <div class="answer-content">${aText || '<em style="color:#999">暂无答案</em>'}</div>
        </div>
        
        ${hasDetail ? `
        <div class="detail-toggle" onclick="toggleDetail(this)" id="dt-${q.id}">
          <span class="arrow">▸</span> 展开完整详细讲解 (${(eText||'').length > 500 ? Math.ceil(eText.length/100)+'字' : '点击展开'})
        </div>
        <div class="detail-content" id="dc-${q.id}">
          <div class="detail-inner">${eText}</div>
        </div>` : ''}
      </div>
    </div>`;
  }).join('');
}

function toggleDetail(btn) {
  const id = btn.id.replace('dt-', '');
  const dc = document.getElementById('dc-' + id);
  const isOpen = dc.classList.contains('show');
  
  dc.classList.toggle('show');
  btn.classList.toggle('open');
  btn.innerHTML = isOpen 
    ? `<span class="arrow">▸</span> 展开完整详细讲解` 
    : `<span class="arrow">▾</span> 收起详细讲解`;
}

function escapeHtml(s) {
  if (!s) return '';
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function getTypeClass(t) {
  if (!t) return 'other';
  if (t.includes('填空')) return 'fill';
  if (t.includes('简答') && !t.includes('简述')) return 'short';
  if (t.includes('计算')) return 'calc';
  if (t.includes('设计')) return 'design';
  if (t.includes('简述') || t.includes('论述')) return 'short';
  if (t.includes('选择') || t.includes('判断') || t.includes('实验')) return 'other';
  return 'other';
}

// 初始加载
displayResults('', 'all');

// 回车触发搜索
searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') doSearch();
});
</script>
</body>
